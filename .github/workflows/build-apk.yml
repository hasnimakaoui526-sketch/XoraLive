name: Build Xora Live APK - fresh rebuild
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'XoraLive_GitHub_Ready.zip'
      - '.github/workflows/build-apk.yml'
      - 'android-fixes/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          test -f XoraLive_GitHub_Ready.zip
          unzip -o XoraLive_GitHub_Ready.zip -d .
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/home.html
          test -f android-fixes/MainActivity.java
          test -f android-fixes/AndroidManifest.xml
          cp android-fixes/MainActivity.java app/src/main/java/com/xoralive/app/MainActivity.java
          cp android-fixes/AndroidManifest.xml app/src/main/AndroidManifest.xml
          grep -q 'handleXoraAuth' app/src/main/assets/index.html
          grep -q 'bootXoraAuthenticatedApp' app/src/main/assets/home.html
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify generated APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Save APK into repository
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/XoraLive-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/XoraLive-debug.apk
          git commit -m "Add latest Xora Live debug APK" || echo "APK unchanged"
          git push
