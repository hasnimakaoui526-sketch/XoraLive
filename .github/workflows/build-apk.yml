name: Build Xora Live APK - fresh rebuild
# Rebuild restored stable source commit 9ce58eec.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'XoraLive_GitHub_Ready.zip'
      - '.github/workflows/build-apk.yml'
      - 'android-fixes/**'
      - 'home.html'
permissions:
  contents: write
concurrency:
  group: xoralive-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          test -f XoraLive_GitHub_Ready.zip
          unzip -o XoraLive_GitHub_Ready.zip -d .
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/home.html
          test -f android-fixes/MainActivity.java
          test -f android-fixes/AndroidManifest.xml
          # Preserve the Android application identity and assign every build a
          # strictly increasing versionCode so upgrades install over prior builds.
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")
          if "applicationId 'com.xoralive.app'" not in s and 'applicationId "com.xoralive.app"' not in s:
              raise SystemExit("Unexpected applicationId; refusing an incompatible build.")
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          version_code = 1000 + run_number
          if version_code >= 2100000000:
              raise SystemExit("Android versionCode limit reached.")
          lines = s.splitlines()
          found_code = found_name = False
          for i, line in enumerate(lines):
              indent = line[:len(line) - len(line.lstrip())]
              if line.strip().startswith("versionCode "):
                  lines[i] = indent + f"versionCode {version_code}"
                  found_code = True
              elif line.strip().startswith("versionName "):
                  lines[i] = indent + f'versionName "1.0.{run_number}"'
                  found_name = True
          if not found_code or not found_name:
              raise SystemExit("Missing versionCode/versionName; refusing an unsafe build.")
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Android upgrade identity preserved; versionCode={version_code}, versionName=1.0.{run_number}")
          PY
          cp android-fixes/MainActivity.java app/src/main/java/com/xoralive/app/MainActivity.java
          cp android-fixes/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp home.html app/src/main/assets/home.html
          # Install the dedicated premium launcher icon without changing app behavior.
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/xora_launcher.xml <<'ICON'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#100711" android:pathData="M18,2 L90,2 Q106,2 106,18 L106,90 Q106,106 90,106 L18,106 Q2,106 2,90 L2,18 Q2,2 18,2 Z"/>
              <path android:fillColor="#00000000" android:strokeColor="#F52CB8" android:strokeWidth="2.4" android:pathData="M18,5 L90,5 Q103,5 103,18 L103,90 Q103,103 90,103 L18,103 Q5,103 5,90 L5,18 Q5,5 18,5 Z"/>
              <path android:fillColor="#00000000" android:strokeColor="#8D176E" android:strokeWidth="5" android:pathData="M54,31 A25,25 0,1 1,53.9 31"/>
              <path android:fillColor="#FF36C5" android:pathData="M47,41 Q45,39 45,43 L45,65 Q45,69 49,67 L68,56 Q72,54 68,52 Z"/>
              <path android:fillColor="#FFC85A" android:pathData="M29,28 L36,16 L45,25 L54,11 L63,25 L72,16 L79,28 L75,35 L33,35 Z"/>
              <path android:fillColor="#FFF0B4" android:pathData="M36,19 L39,25 L35,25 Z M54,15 L57,23 L51,23 Z M72,19 L75,25 L69,25 Z"/>
              <path android:fillColor="#D92AA5" android:pathData="M75,70 L91,70 Q96,70 96,75 L96,83 Q96,88 91,88 L83,88 L77,93 L78,88 L75,88 Q70,88 70,83 L70,75 Q70,70 75,70 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M77,78 A2,2 0,1 0,81 78 A2,2 0,1 0,77 78 M83,78 A2,2 0,1 0,87 78 A2,2 0,1 0,83 78 M89,78 A2,2 0,1 0,93 78 A2,2 0,1 0,89 78"/>
              <path android:fillColor="#FFD36C" android:pathData="M18,54 L20,59 L25,61 L20,63 L18,68 L16,63 L11,61 L16,59 Z M86,39 L88,43 L92,45 L88,47 L86,51 L84,47 L80,45 L84,43 Z"/>
          </vector>
          ICON
          test -s app/src/main/res/drawable/xora_launcher.xml
          # Reveal the login UI immediately; the previous 8-second splash timer left
          # the app looking blank during startup on some Android WebViews.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")
          old = "  }, 8000);"
          if old not in s:
              raise SystemExit("Expected splash timer was not found; refusing to modify the page.")
          s = s.replace(old, "  }, 0);", 1)
          p.write_text(s, encoding="utf-8")
          PY
          # Restore the missing role loader: the auth bootstrap calls this on every sign-in.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/home.html")
          s = p.read_text(encoding="utf-8")
          anchor = "let xoraMyRole='member';"
          fn = """let xoraMyRole='member';
          async function refreshMyAppRole(){
            if(!xoraUser){xoraMyRole='member';return xoraMyRole;}
            const {data,error}=await xoraSupabase.from('profiles').select('role_key').eq('id',xoraUser.id).maybeSingle();
            if(error){console.warn('تعذر تحميل رتبة الحساب:',error.message);xoraMyRole='member';return xoraMyRole;}
            xoraMyRole=data?.role_key||'member';
            return xoraMyRole;
          }
          """
          if s.count(anchor) != 1:
              raise SystemExit("Expected unique xoraMyRole anchor was not found; refusing to patch.")
          if "async function refreshMyAppRole()" not in s:
              s = s.replace(anchor, fn, 1)
          p.write_text(s, encoding="utf-8")
          PY
          grep -q 'async function refreshMyAppRole' app/src/main/assets/home.html
          grep -q 'handleXoraAuth' app/src/main/assets/index.html
          grep -q 'bootXoraAuthenticatedApp' app/src/main/assets/home.html
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p app/keystore
          # Clipboard copies can contain line breaks or non-base64 decoration.
          # Normalize the secret, decode strictly, then validate the actual keystore
          # and alias before touching the Gradle configuration.
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          cleaned = re.sub(r"[^A-Za-z0-9_+/=-]", "", raw).replace("_", "/").replace("-", "+")
          cleaned = cleaned.rstrip("=")
          cleaned += "=" * ((4 - len(cleaned) % 4) % 4)
          try:
              data = base64.b64decode(cleaned, validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid Base64. Re-copy the complete Base64 file into that GitHub secret.") from exc
          if len(data) < 512:
              raise SystemExit("Decoded keystore is unexpectedly small; the Base64 secret appears incomplete.")
          Path("app/keystore/xora-release.jks").write_bytes(data)
          print(f"Decoded Android keystore ({len(data)} bytes).")
          PY
          keytool -list -keystore app/keystore/xora-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Android keystore and alias validated."
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")
          m = re.search(r"\bandroid\s*\{", s)
          if not m:
              raise SystemExit("Could not find android { block in app/build.gradle")
          def close_brace(text, opening):
              depth = 0
              quote = None
              escaped = False
              for i in range(opening, len(text)):
                  c = text[i]
                  if quote:
                      if escaped: escaped = False
                      elif c == "\\": escaped = True
                      elif c == quote: quote = None
                      continue
                  if c in ("'", '"'): quote = c
                  elif c == "{": depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0: return i
              raise SystemExit("Unbalanced Gradle braces")
          android_open = s.find("{", m.start())
          android_close = close_brace(s, android_open)
          signing = """
              signingConfigs {
                  release {
                      storeFile file("keystore/xora-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in s:
              s = s[:android_open+1] + signing + s[android_open+1:]
          bt = re.search(r"\bbuildTypes\s*\{", s[android_open:android_close+len(signing)])
          if bt:
              bt_open = android_open + bt.end() - 1
              bt_close = close_brace(s, bt_open)
              rel = re.search(r"\brelease\s*\{", s[bt_open:bt_close])
              if rel:
                  rel_open = bt_open + rel.end() - 1
                  if "signingConfig signingConfigs.release" not in s[rel_open:close_brace(s, rel_open)]:
                      s = s[:rel_open+1] + "\n            signingConfig signingConfigs.release" + s[rel_open+1:]
              else:
                  s = s[:bt_open+1] + "\n        release { signingConfig signingConfigs.release }\n" + s[bt_open+1:]
          else:
              android_close = close_brace(s, android_open)
              s = s[:android_close] + "\n    buildTypes { release { signingConfig signingConfigs.release } }\n" + s[android_close:]
          p.write_text(s, encoding="utf-8")
          PY
      - name: Build debug and signed release APKs
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Verify generated APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: XoraLive-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK as private GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="apk-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Xora Live APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK generated by GitHub Actions. Repository remains private." \
            --latest=false
      - name: Save APK into repository
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            for path in home.html android-fixes/MainActivity.java android-fixes/AndroidManifest.xml XoraLive_GitHub_Ready.zip; do
              built="$(git rev-parse "$GITHUB_SHA:$path")"
              latest="$(git rev-parse "origin/main:$path")"
              if [ "$built" != "$latest" ]; then
                echo "A newer source revision exists; skipping this stale APK. The newer run will build it."
                exit 0
              fi
            done
            git reset --hard origin/main
            mkdir -p downloads
            cp app/build/outputs/apk/release/app-release.apk downloads/XoraLive-release.apk
            git add downloads/XoraLive-release.apk
            if git diff --cached --quiet; then
              echo "APK unchanged"
              exit 0
            fi
            git commit -m "Add latest Xora Live debug APK"
            if git push origin HEAD:main; then
              echo "APK saved successfully"
              exit 0
            fi
            echo "Branch moved during APK upload; retrying against latest main."
          done
          echo "Could not save APK after 3 attempts."
          exit 1
