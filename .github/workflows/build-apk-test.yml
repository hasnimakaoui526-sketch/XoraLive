name: Xora Live - New Test Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk-test.yml'
permissions:
  contents: write
concurrency:
  group: xoralive-test-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          set -e
          test -f XoraLive_GitHub_Ready.zip
          unzip -o XoraLive_GitHub_Ready.zip -d .
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/home.html
          test -f android-fixes/MainActivity.java
          test -f android-fixes/AndroidManifest.xml
          cp android-fixes/MainActivity.java app/src/main/java/com/xoralive/app/MainActivity.java
          cp android-fixes/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp home.html app/src/main/assets/home.html
          grep -q 'handleXoraAuth' app/src/main/assets/index.html
          grep -q 'bootXoraAuthenticatedApp' app/src/main/assets/home.html
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build fresh debug APK
        run: gradle --no-daemon --refresh-dependencies assembleDebug
      - name: Verify APK
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: XoraLive-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish test APK to public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="xoralive-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Xora Live Test Build ${GITHUB_RUN_NUMBER}" \
            --notes "Fresh test APK built from the current main branch." \
            --latest=false
      - name: Save a direct-download copy in the public repository
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/XoraLive-test.apk
          git add downloads/XoraLive-test.apk
          if git diff --cached --quiet; then
            echo "Test APK is unchanged."
            exit 0
          fi
          git commit -m "Publish fresh Xora Live test APK"
          git push origin HEAD:main
