plugins { id 'com.android.application' }

android {
    namespace 'com.xoralive.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xoralive.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
